<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,700;1,600&family=Mulish:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 1200x630 share card. Everything that matters lives inside the center 630px safe box (x 285-915). */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#15110d;font-family:'Mulish',sans-serif}
.bg{position:absolute;inset:0;background:url('../assets/img/hero-d.jpg') center 45%/cover no-repeat}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,17,13,.55),rgba(21,17,13,.78) 55%,rgba(21,17,13,.95)),radial-gradient(50% 45% at 50% 40%,rgba(227,178,60,.16),transparent 70%)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f7efe1}
.k{font-weight:700;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#dccfb8;display:flex;align-items:center;gap:16px;margin-bottom:18px}
.k i{display:block;width:34px;height:3px;background:#e3b23c}
h1{font-family:'Zilla Slab',serif;font-weight:700;font-size:118px;line-height:.92;margin:0;letter-spacing:-.005em;text-shadow:0 8px 30px rgba(0,0,0,.6)}
h1 em{font-style:italic;font-weight:600;color:#e3b23c}
.sub{font-family:'Zilla Slab',serif;font-weight:600;font-size:40px;letter-spacing:.3em;text-indent:.3em;margin-top:14px}
.row{margin-top:26px;display:flex;align-items:center;gap:18px;font-size:22px;font-weight:600;color:#f7efe1}
.pill{background:#e3b23c;color:#1a1408;border-radius:999px;padding:12px 26px;font-weight:700;font-size:24px}
.star{display:inline-block;width:26px;height:26px;vertical-align:-4px;margin-right:6px}
.foot{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:20px;color:#dccfb8;letter-spacing:.06em}
</style></head>
<body>
<div class="bg"></div><div class="veil"></div>
<div class="c">
  <div class="k"><i></i>Flour Bluff · Corpus Christi<i></i></div>
  <h1>Cold beer.<br><em>Friendly faces.</em></h1>
  <div class="sub">OASIS TAVERN</div>
  <div class="row">
    <span class="pill">Karaoke · Pool · Patio</span>
    <span><svg class="star" viewBox="0 0 24 24" fill="#f0b429"><polygon points="12,2 15.1,8.6 22,9.3 16.8,14.1 18.2,21 12,17.6 5.8,21 7.2,14.1 2,9.3 8.9,8.6"/></svg>4.2 on Google</span>
  </div>
</div>
<div class="foot">722 NAS Dr · (361) 937-1911 · Open 7 days</div>
</body></html>
