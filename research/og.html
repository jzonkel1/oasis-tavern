<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 1200x630 share card. Everything that matters lives inside the center 630px safe box (x 285-915). */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#111110;font-family:'Source Sans 3',sans-serif}
.bg{position:absolute;inset:0;background:url('../assets/img/hero-d.jpg') center 45%/cover no-repeat}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,16,.5),rgba(17,17,16,.72) 55%,rgba(17,17,16,.95))}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f4efe4}
.sign{width:520px;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.7);transform:rotate(-1.5deg);margin-bottom:26px}
h1{font-family:'Antonio',sans-serif;font-weight:700;font-size:64px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 6px 24px rgba(0,0,0,.6)}
h1 em{font-style:normal;color:#c9a54a}
.row{margin-top:18px;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:600;color:#f4efe4}
.star{display:inline-block;width:26px;height:26px;vertical-align:-4px;margin-right:6px}
.foot{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:21px;color:#d9d2c3;letter-spacing:.04em}
</style></head>
<body>
<div class="bg"></div><div class="veil"></div>
<div class="c">
  <img class="sign" src="../assets/img/sign.jpg" alt="">
  <h1>Cold beer. Pool.<br><em>Friendly faces.</em></h1>
  <div class="row"><span><svg class="star" viewBox="0 0 24 24" fill="#e9b53a"><polygon points="12,2 15.1,8.6 22,9.3 16.8,14.1 18.2,21 12,17.6 5.8,21 7.2,14.1 2,9.3 8.9,8.6"/></svg>4.2 on Google</span><span>·</span><span>Karaoke Saturdays</span><span>·</span><span>Open 7 days</span></div>
</div>
<div class="foot">722 NAS Dr, Flour Bluff · (361) 937-1911</div>
</body></html>
