<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 1200x630 share card. Everything that matters lives inside the center 630px safe box (x 285-915). */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#111110;font-family:'Source Sans 3',sans-serif}
.bg{position:absolute;inset:0;background:url('../assets/img/hero-d.jpg') center 45%/cover no-repeat}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,15,13,.55),rgba(16,15,13,.75) 55%,rgba(16,15,13,.95))}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f4efe4}
.sign{width:300px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.75));margin-bottom:18px}
h1{font-family:'Lilita One',sans-serif;font-weight:400;font-size:53px;line-height:1.04;margin:0;letter-spacing:.005em;text-shadow:0 6px 24px rgba(0,0,0,.6)}
h1 em{font-style:normal;color:#5fd0d2}
.row{margin-top:18px;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:600;color:#f4efe4}
.star{display:inline-block;width:26px;height:26px;vertical-align:-4px;margin-right:6px}
.foot{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:21px;color:#d9d2c3;letter-spacing:.04em}
</style></head>
<body>
<div class="bg"></div><div class="veil"></div>
<div class="c">
  <img class="sign" src="../assets/img/logo.png" alt="">
  <h1>Good drinks. Good people.<br><em>Good times.</em></h1>
  <div class="row"><span><svg class="star" viewBox="0 0 24 24" fill="#e9b53a"><polygon points="12,2 15.1,8.6 22,9.3 16.8,14.1 18.2,21 12,17.6 5.8,21 7.2,14.1 2,9.3 8.9,8.6"/></svg>129 reviews on Google</span><span>·</span><span>Live music · Karaoke · Pool</span><span>·</span><span>Open 7 days</span></div>
</div>
<div class="foot">722 NAS Dr, Flour Bluff · (361) 937-1911</div>
</body></html>
